name: Build firmware

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio esptool

      - name: Build firmware
        run: pio run -e cardputer-radar-csi

      - name: Merge binaries (flash at 0x0)
        run: |
          python -m esptool --chip esp32s3 merge_bin \
            -o cardputer-csi-st7789v.bin \
            --flash_mode qio --flash_size 8MB \
            0x0000 .pio/build/cardputer-radar-csi/bootloader.bin \
            0x8000 .pio/build/cardputer-radar-csi/partitions.bin \
            0x10000 .pio/build/cardputer-radar-csi/firmware.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-csi-st7789v
          path: |
            cardputer-csi-st7789v.bin
            .pio/build/cardputer-radar-csi/firmware.bin
          if-no-files-found: error
