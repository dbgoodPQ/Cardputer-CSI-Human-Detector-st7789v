name: Build firmware

on:
  push:
    branches: [ main, version2 ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini', 'tools/node_esp32/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio esptool

      - name: Build firmware
        run: pio run -e cardputer-radar-csi

      - name: Merge binaries (flash at 0x0)
        run: |
          python -m esptool --chip esp32s3 merge_bin \
            -o cardputer-csi-st7789v.bin \
            --flash_mode qio --flash_size 8MB \
            0x0000 .pio/build/cardputer-radar-csi/bootloader.bin \
            0x8000 .pio/build/cardputer-radar-csi/partitions.bin \
            0x10000 .pio/build/cardputer-radar-csi/firmware.bin

      - name: Build sensor node firmware (ESP32-WROOM-32 / 32D)
        run: pio run -d tools/node_esp32 -e esp32-node

      - name: Merge node binaries (flash at 0x0)
        run: |
          B=tools/node_esp32/.pio/build/esp32-node
          python -m esptool --chip esp32 merge_bin \
            -o csi-node-esp32.bin \
            --flash_mode dio --flash_size 4MB \
            0x1000 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin

      - name: Name files with the firmware version (include/fw_version.h)
        run: |
          V=$(sed -n 's/.*FW_VERSION "\(.*\)".*/\1/p' include/fw_version.h)
          test -n "$V"
          echo "FW_VERSION=$V" >> "$GITHUB_ENV"
          mkdir -p out
          cp cardputer-csi-st7789v.bin                     out/cardputer-csi-st7789v-$V.bin
          cp .pio/build/cardputer-radar-csi/firmware.bin   out/cardputer-csi-st7789v-$V-app.bin
          cp csi-node-esp32.bin                            out/csi-node-esp32-$V.bin
          cp tools/node_esp32/.pio/build/esp32-node/firmware.bin out/csi-node-esp32-$V-app.bin
          {
            echo "### Firmware $V"
            echo "- Update, keeps Wi-Fi and pairing: \`*-$V-app.bin\` at **0x10000**"
            echo "- New board / full reset (erases Wi-Fi, nodes must re-pair): \`*-$V.bin\` at **0x0**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Cardputer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-csi-st7789v-${{ env.FW_VERSION }}
          path: |
            out/cardputer-csi-st7789v-${{ env.FW_VERSION }}.bin
            out/cardputer-csi-st7789v-${{ env.FW_VERSION }}-app.bin
          if-no-files-found: error

      - name: Upload node artifact
        uses: actions/upload-artifact@v4
        with:
          name: csi-node-esp32-${{ env.FW_VERSION }}
          path: |
            out/csi-node-esp32-${{ env.FW_VERSION }}.bin
            out/csi-node-esp32-${{ env.FW_VERSION }}-app.bin
          if-no-files-found: error
