; WiFi-CSI Radar v2 - Cardputer ADV console
; Target: M5Stack Cardputer ADV (ESP32-S3 / StampS3, 8MB flash, no PSRAM)
; The Cardputer only displays and manages the sensor nodes (tools/node_esp32);
; it does no sensing itself. Wi-Fi is picked on the device on first boot.

[platformio]
default_envs = cardputer-radar-csi

; Console build (name kept from v1). Flash with:  pio run -e cardputer-radar-csi -t upload
[env:cardputer-radar-csi]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
; Pinned: M5GFX 0.3.0 (Nov 2026) rewrote board auto-detection and probes G5/G6,
; which are the external screen's CS/DC on this build -> Cardputer ADV is
; misdetected (wrong internal rotation, external screen dead). Stay on 0.2.x.
lib_deps =
    m5stack/M5GFX@0.2.36
    m5stack/M5Unified@0.2.29
    m5stack/M5Cardputer@1.1.1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_M5Stack_StampS3
    -Os

