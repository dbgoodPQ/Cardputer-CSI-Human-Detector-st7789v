; CSI sensor node for ESP32-WROOM-32 / WROOM-32D boards (classic ESP32).
; One firmware for every node: no names or Wi-Fi details are built in.
; Pair it from the Cardputer: settings (`) > NODES > ADD NODE.
;
; Build:  cd tools/node_esp32 && pio run          (flash: pio run -t upload)
; CI also builds csi-node-esp32.bin (merged, flash at 0x0).

[platformio]
default_envs = esp32-node

[env:esp32-node]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -I../../include
    -Os
    ; Board LED used to show setup mode / motion / "blink" (most ESP32 dev boards: GPIO2)
    -DNODE_LED_PIN=2
